name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit and integration tests
        run: python -m pytest -q

      - name: main.py reads every emulator
        run: python main.py

      - name: Smoke plan through the CLI
        run: python run_tests.py run --plan smoke

      # Every request's send time and latency, so a timing problem on a runner can be
      # diagnosed from the build log instead of guessed.
      - name: Per-request timing from the run logs
        if: always()
        shell: bash
        run: |
          for f in results/logs/*.log; do
            echo "== $f"
            grep -E "#[0-9]+ t=|VERDICT|check frequency" "$f" || true
          done

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: results-${{ matrix.os }}-py${{ matrix.python }}
          path: results/
          if-no-files-found: ignore
          retention-days: 7
